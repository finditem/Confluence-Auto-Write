name: Combined Weekly Report

on:
  schedule:
    - cron: "17 6 * * 1" # every Monday 15:17 KST
  workflow_dispatch: {}

jobs:
  post-to-confluence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m combined.weekly_report
        env:
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          FRONTEND_SPACE_KEY: ${{ secrets.FRONTEND_SPACE_KEY }}
          BACKEND_SPACE_KEY: ${{ secrets.BACKEND_SPACE_KEY }}
          COMBINED_SPACE_KEY: ${{ secrets.COMBINED_SPACE_KEY }}
          COMBINED_PARENT_PAGE_ID: ${{ secrets.COMBINED_PARENT_PAGE_ID }}
